<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    (function () {
      try {
        var screenWidth = Math.min(window.screen.width || 9999, window.screen.height || 9999);
        var touchDevice = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
        var layoutWidth = window.innerWidth || document.documentElement.clientWidth || 9999;
        /* Apply compact overrides only when Chrome is forcing a desktop-width viewport on a phone. */
        if (touchDevice && screenWidth <= 600 && layoutWidth > 600) document.documentElement.classList.add("amg-compact-device");
      } catch (_) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
