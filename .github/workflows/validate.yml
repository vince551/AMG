name: Validate AMG Library
on:
  push:
    branches:
      - feature/firebase-library-upgrade
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tooling
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: npm test
